<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Visual Archive</title>
    <style>
        :root {
            --bg-deep: #fff8f8; --bg-surface: #ffffff; --accent-gold: #c99398; --accent-dark: #4a1525; --text-main: #33141e; --text-muted: #8a6873; --border-line: #f2e1e3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 8%; border-bottom: 1px solid var(--border-line); background-color: rgba(255, 248, 248, 0.85); backdrop-filter: blur(10px); }
        .nav-logo { font-family: "Georgia", serif; font-size: 1.4rem; font-weight: bold; color: var(--accent-dark); }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 30px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; }
        .nav-links a.active { color: var(--accent-dark); border-bottom: 2px solid var(--accent-gold); padding-bottom: 4px; }

        .gallery-container { max-width: 1050px; margin: 0 auto; padding: 80px 20px; opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .gallery-container.loaded { opacity: 1; transform: translateY(0); }
        .page-header { font-family: "Georgia", serif; font-size: 2rem; font-weight: 400; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-dark); border-left: 4px solid var(--accent-gold); padding-left: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .grid-item { background-color: var(--bg-surface); border: 1px solid var(--border-line); aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(74, 21, 37, 0.03); transition: border-color 0.3s, transform 0.3s; }
        .grid-item:hover { border-color: var(--accent-gold); transform: translateY(-3px); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">love🩷🩷🩷</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <div class="gallery-container" id="galleryView">
        <h2 class="page-header">Visual Log of the Archived beauty</h2>
        <div class="grid">
            <div class="grid-item"><img src="images/pic1.jpg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic2.jpg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic3.jpg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic4.jpeg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic5.jpg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic6.jpg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic7.jpeg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic8.jpeg" style="width:100%; height:100%; object-fit:cover;"></div>
            <div class="grid-item"><img src="images/pic9.jpeg" style="width:100%; height:100%; object-fit:cover;"></div>
        </div>
        </div>

        <h2>The beauty of the Almighty</h2>
        <h> much much love </h>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => { document.getElementById('galleryView').classList.add('loaded'); });
    </script>
</body>
</html>
