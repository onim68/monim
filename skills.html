<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Core Attributes</title>
    <style>
        :root {
            --bg-deep: #fff8f8; --bg-surface: #ffffff; --accent-gold: #c99398; --accent-dark: #4a1525; --text-main: #33141e; --text-muted: #8a6873; --border-line: #f2e1e3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 25px 8%; border-bottom: 1px solid var(--border-line); background-color: rgba(255, 248, 248, 0.85); backdrop-filter: blur(10px); }
        .nav-logo { font-family: "Georgia", serif; font-size: 1.4rem; font-weight: bold; color: var(--accent-dark); }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 30px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; }
        .nav-links a.active { color: var(--accent-dark); border-bottom: 2px solid var(--accent-gold); padding-bottom: 4px; }

        .skills-container { max-width: 800px; margin: 0 auto; padding: 80px 20px; opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .skills-container.loaded { opacity: 1; transform: translateY(0); }
        .page-header { font-family: "Georgia", serif; font-size: 2rem; font-weight: 400; margin-bottom: 50px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-dark); border-left: 4px solid var(--accent-gold); padding-left: 15px; }
        .skill-node { margin-bottom: 40px; background: var(--bg-surface); padding: 20px 25px; border-radius: 8px; border: 1px solid var(--border-line); box-shadow: 0 10px 25px rgba(74, 21, 37, 0.02); }
        .meta { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-dark); }
        .track { width: 100%; height: 8px; background-color: #faf3f4; border-radius: 4px; overflow: hidden; }
        .fill { height: 100%; background-color: var(--accent-gold); width: 0%; transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Monica</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="skills.html" class="active">Skills</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <div class="skills-container" id="skillsView">
        <h2 class="page-header">Key Competencies & Qualities</h2>
        <div class="skill-node">
            <div class="meta"><span>KIND, LOVING AND FORGIVING HEART</span><span>100%</span></div>
            <div class="track"><div class="fill" data-pct="100%"></div></div>
        </div>
        <div class="skill-node">
            <div class="meta"><span>CARING AND EMPATHY SKILLS</span><span>100%</span></div>
            <div class="track"><div class="fill" data-pct="100%"></div></div>
        </div>
        <div class="skill-node">
            <div class="meta"><span>INDOORS SKILLS (Handling Me)</span><span>99.9%</span></div>
            <div class="track"><div class="fill" data-pct="99.9%"></div></div>
        </div>

        <h2>Highly skilled in every sector, has all unimaginable and imaginable skills</h2>
        <h2> Very effective in all sectors</h2>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('skillsView').classList.add('loaded');
            setTimeout(() => { document.querySelectorAll('.fill').forEach(f => f.style.width = f.getAttribute('data-pct')); }, 300);
        });
    </script>
</body>
</html>
